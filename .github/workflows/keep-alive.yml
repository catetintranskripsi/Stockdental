ping-midtrans:
    runs-on: ubuntu-latest
    steps:
      - name: Ping midtrans-router
        run: |
          curl -sf -o /dev/null -w "%{http_code}\n" \
            "${{ secrets.SUPABASE_URL_MIDTRANS }}/rest/v1/heartbeat?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY_MIDTRANS }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY_MIDTRANS }}"
